function guest(){S.p={asset:null,goal:'',target:null,saved:0,rows:[],missions:[]};S.custom=[];S.page='app';S.tab='home';render()}
function home(){let p=S.p;return phone('<div class="content">'+head('홈')+(p.asset===null?'<div class="card"><h3>돈 관리를 시작해 볼까요?</h3><p class="muted">현재 자산과 목표를 입력하면 바로 반영돼요.</p><div class="field"><label>현재 자산</label><input id="asset" inputmode="numeric" placeholder="예: 128000"></div><div class="field"><label>전체 목표 이름</label><input id="goal" placeholder="예: 교환학생"></div><div class="field"><label>목표 금액</label><input id="target" inputmode="numeric" placeholder="예: 10000000"></div><button class="primary" onclick="setup()">시작 정보 저장하기</button></div>':'<div class="card"><h3>현재 자산</h3><div class="big">'+won(p.asset)+'</div></div>')+(p.goal?'<div class="card"><h3>전체 목표 · '+p.goal+'</h3><div class="big">'+Math.round(p.saved/p.target*100)+'%</div><p class="muted">'+won(p.saved)+' / '+won(p.target)+'</p></div>':'')+'<div class="card"><h3>오늘의 미션</h3><p class="muted">체크와 문구를 직접 수정할 수 있어요.</p>'+p.missions.map((m,i)=>'<div class="mission"><input class="check" type="checkbox" '+(m.done?'checked':'')+' onchange="check('+i+')"><input type="text" value="'+esc(m.text)+'" onchange="rename('+i+',this.value)"><button onclick="delM('+i+')">×</button></div>').join('')+'<div class="addmission"><input id="newM" placeholder="새로운 일일 미션 입력"><button onclick="addM()">추가</button></div></div></div>')}
function ledger(){let r=mr();return phone('<div class="content">'+head('가계부')+'<div class="seg"><button class="'+(S.ledger==='daily'?'on':'')+'" onclick="S.ledger=\'daily\';render()">일일</button><button class="'+(S.ledger==='month'?'on':'')+'" onclick="S.ledger=\'month\';render()">월별</button></div>'+months()+(S.ledger==='daily'?daily(r):cal(r))+'</div><button class="fab" onclick="openE(\'expense\')">＋ 내역 추가</button>')}
function months(){return '<div class="month"><button onclick="move(-1)">‹</button><span>'+ym()+'</span><button onclick="move(1)">›</button></div>'}
function daily(r){let ds=[...new Set(r.map(x=>x.date))].sort().reverse(),i=sum(r.filter(x=>x.type==='income')),o=sum(r.filter(x=>x.type==='expense'));return '<div class="sum"><div><span>이번 달 수입</span><b>'+won(i)+'</b></div><div><span>이번 달 지출</span><b class="out">'+won(o)+'</b></div><div><span>남은 금액</span><b>'+won(i-o)+'</b></div></div>'+(ds.length?ds.map(d=>'<div class="card day"><div class="dayhead"><span>'+dh(d)+'</span><button onclick="openE(\'expense\',\''+d+'\')">내역 추가</button></div>'+r.filter(x=>x.date===d).map(row).join('')+'</div>').join(''):'<div class="card empty"><b>'+ym()+' 내역이 없어요</b>날짜를 선택해 첫 내역을 추가해 보세요.</div>')}
function row(x){return '<button class="row" onclick="edit(\''+x.id+'\')"><div class="ico">'+(IC[x.cat]||'•')+'</div><div class="copy"><b>'+esc(x.title)+'</b><small>'+x.cat+' · '+dh(x.date)+'</small></div><strong class="amount '+x.type+'">'+(x.type==='income'?'+':'−')+won(x.amount)+'</strong></button>'}
function dh(s){let d=new Date(s+'T00:00:00'),w=['일','월','화','수','목','금','토'];return d.getDate()+'일 '+w[d.getDay()]+'요일'}
function cal(r){let y=S.month.getFullYear(),m=S.month.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();return '<div class="calendar">'+['일','월','화','수','목','금','토'].map(x=>'<div class="week">'+x+'</div>').join('')+Array.from({length:f+n},(_,z)=>{let d=z-f+1;if(d<1)return '<div></div>';let q=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),a=r.filter(x=>x.date===q),i=sum(a.filter(x=>x.type==='income')),o=sum(a.filter(x=>x.type==='expense'));return '<button onclick="openE(\'expense\',\''+q+'\')"><b style="display:block;transform:translateY(-4px)">'+d+'</b>'+(i?'<small class="plus">+'+won(i)+'</small>':'')+(o?'<small class="minus">−'+won(o)+'</small>':'')+'</button>'}).join('')+'</div>'}
function entry(){let old=S.edit&&S.p.rows.find(x=>x.id===S.edit),t=old?old.type:S.type,cats=[...(t==='income'?INC:EXP),...S.custom.filter(x=>x.type===t).map(x=>x.name)],cat=S.pick||(old?old.cat:(t==='income'?'용돈':'식비'));return phone('<div class="content"><div class="etitle"><button class="back" onclick="closeE()">‹</button><h2>'+ (old?'내역 수정':t==='income'?'수입 추가':'지출 추가')+'</h2><button class="close" onclick="closeE()">×</button></div><div class="etype"><button class="'+(t==='income'?'on':'')+'" onclick="openE(\'income\',null,\''+(old?old.id:'')+'\')">수입</button><button class="'+(t==='expense'?'on':'')+'" onclick="openE(\'expense\',null,\''+(old?old.id:'')+'\')">지출</button></div><div class="field"><label>날짜</label><input id="date" type="date" value="'+(old?old.date:S.date)+'"></div><div class="field"><label>금액</label><input id="amount" inputmode="numeric" value="'+(old?old.amount:'')+'" placeholder="금액"></div><div class="field"><label>내용</label><input id="title" value="'+(old?esc(old.title):'')+'" placeholder="예: 점심 식비"></div><p class="ct">'+(t==='income'?'수입':'지출')+' 카테고리</p><div class="grid">'+cats.map(x=>'<button class="'+(x===cat?'on':'')+'" onclick="pick(\''+x.replace(/'/g,"\\'")+'\')"><i>'+ (IC[x]||'•••')+'</i>'+x+(x==='기타'?' +':'')+'</button>').join('')+'</div>'+((cat==='기타'||S.pick==='기타')?'<div class="custom"><input id="custom" placeholder="직접 카테고리 입력"><button onclick="addC()">추가</button></div>':'')+'<button class="primary save" onclick="saveE()">'+(old?'수정 저장하기':'저장하기')+'</button></div>')}
function stats(){let a=mr().filter(x=>x.type===S.stat),cats=S.stat==='income'?INC:EXP,items=cats.map((n,i)=>({n,v:sum(a.filter(x=>x.cat===n)),c:COL[i]})).filter(x=>x.v).sort((a,b)=>b.v-a.v),z=sum(a),at=0,s=z?items.map(x=>{let q=at;at+=x.v/z*360;return x.c+' '+q+'deg '+at+'deg'}).join(','):'#e8effa 0 360deg';return phone('<div class="content">'+head('통계')+months()+'<div class="seg"><button class="'+(S.stat==='income'?'on':'')+'" onclick="S.stat=\'income\';render()">수입</button><button class="'+(S.stat==='expense'?'on':'')+'" onclick="S.stat=\'expense\';render()">지출</button></div><div class="total">이번 달 총 '+(S.stat==='income'?'수입':'지출')+' <b>'+won(z)+'</b></div>'+(z?'<h3>'+ (S.month.getMonth()+1)+'월 '+(S.stat==='income'?'수입':'지출')+' 분석</h3><div class="card"><div class="donutwrap"><div class="donut" style="background:conic-gradient('+s+')"><span>이번 달<b>'+won(z)+'</b></span></div></div>'+items.map(x=>'<div class="rank"><i class="dot" style="background:'+x.c+'"></i><strong>'+x.n+'</strong><em><b>'+won(x.v)+'</b>'+Math.round(x.v/z*100)+'%</em></div>').join('')+'</div>':'<div class="card empty"><b>분석할 내역이 없어요</b>가계부에 입력하면 월별 원그래프가 표시돼요.</div>')+'</div>')}
function whatif(){let p=S.p;if(!p.target)return phone('<div class="content">'+head('만약에')+'<div class="card empty"><b>먼저 전체 목표를 입력해 주세요</b>홈에서 목표를 설정하면 소비 계획을 계산할 수 있어요.<button class="primary" style="margin-top:16px" onclick="go(\'home\')">홈에서 목표 설정하기</button></div></div>');let d=Math.max(1,Math.ceil((p.target-p.saved)/30000));return phone('<div class="content">'+head('만약에')+'<div class="card danger"><span class="badge">! 위험</span><div class="dnum">D-'+d+'</div><b style="font-size:23px">이대로 쓰면 거지가 돼요.</b></div><div class="card"><p class="muted" style="text-align:center">가장 먼저 줄여볼 소비</p><p style="text-align:center;font-size:23px;font-weight:900">☕ 아메리카노 '+S.coffee+'번 · '+won(S.coffee*5000)+'</p><p class="muted" style="text-align:center">위험 시점을 가장 앞당긴 소비예요.</p></div><div class="card"><p style="text-align:center;font-weight:900">아메리카노를 몇 번 덜 마실까요?</p><div class="step"><button onclick="S.coffee=Math.max(0,S.coffee-1);render()">−</button><b>'+S.coffee+'번</b><button onclick="S.coffee++;render()">＋</button></div><p style="text-align:center;color:var(--g);font-weight:900;font-size:20px">'+won(S.coffee*5000)+' 절약</p></div><div class="card"><p style="text-align:center;font-weight:900">돈 바닥 날짜</p><div class="forecast"><div><b class="before">D-'+d+'</b>현재</div><strong>→</strong><div><b class="after">D-'+(d+S.coffee*2)+'</b>'+S.coffee*2+'일 더 버틸 수 있어요</div></div></div><button class="primary save" onclick="toast(\'이 계획으로 시작했어요.\')">이 계획으로 시작하기</button></div>')}
function my(){let I=[svg('<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),svg('<path d="M4 12a8 8 0 1 1 3 6"/><path d="M4 18v-5h5"/>'),svg('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'),svg('<path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/>'),svg('<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v10c0 2 3 3 7 3s7-1 7-3V5M5 10c0 2 3 3 7 3s7-1 7-3"/>')];return phone('<div class="content">'+head('마이')+'<div class="card"><div class="profile"><div class="avatar">●</div><div><b>사용자</b><p class="muted">guest@donjo.app</p></div></div></div><h3>개인 설정</h3><div class="card settings">'+[['내 위험 기준','경고 금액과 위험 금액 설정'],['목표 관리','전체 목표 및 마감일 관리'],['알림 설정','오늘의 미션 알림'],['카테고리 관리','직접 만든 카테고리 '+S.custom.length+'개'],['데이터 관리','내역 내보내기 및 백업']].map((x,n)=>'<button onclick="toast(\''+x[0]+' 설정을 준비 중이에요.\')"><i>'+I[n]+'</i><span>'+x[0]+'<small>'+x[1]+'</small></span>›</button>').join('')+'</div><button class="logout" onclick="S.page=\'login\';render()">로그아웃</button></div>')}
function go(x){S.tab=x;S.page='app';render()}
function move(n){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+n,1);render()}
function mr(){return S.p.rows.filter(x=>x.date.slice(0,7)===k())}
function openE(t,d,id){S.page='entry';S.type=t;S.date=d||S.date;S.edit=id||null;S.pick=null;render()}
function edit(id){let x=S.p.rows.find(x=>x.id===id);openE(x.type,x.date,id)}
function closeE(){S.page='app';S.tab='ledger';render()}
function pick(x){S.pick=x;render()}
function addC(){let x=custom.value.trim();if(!x)return toast('이름을 입력해 주세요.');S.custom.push({name:x,type:S.type});S.pick=x;render()}
function saveE(){let old=S.edit&&S.p.rows.find(x=>x.id===S.edit),x={id:S.edit||String(Date.now()),type:S.type,date:date.value,title:title.value.trim(),amount:Number(amount.value.replace(/[^0-9]/g,'')),cat:S.pick||(old?old.cat:(S.type==='income'?'용돈':'식비'))};if(!x.date||!x.title||!x.amount)return toast('날짜, 내용, 금액을 입력해 주세요.');old?Object.assign(old,x):S.p.rows.push(x);closeE();toast('내역을 저장했어요.')}
function setup(){let a=Number(asset.value.replace(/[^0-9]/g,'')),g=goal.value.trim(),t=Number(target.value.replace(/[^0-9]/g,''));if(!g||!t)return toast('목표 이름과 금액을 입력해 주세요.');Object.assign(S.p,{asset:a,goal:g,target:t});render()}
function check(i){S.p.missions[i].done=!S.p.missions[i].done;render()}
function rename(i,x){S.p.missions[i].text=x;render()}
function delM(i){S.p.missions.splice(i,1);render()}
function addM(){if(newM.value.trim()){S.p.missions.push({text:newM.value.trim(),done:false});render()}}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),2200)}render();
</script></body></html>
