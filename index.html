<html lang="ko">
<head>

  <style>
    :root{--blue:#1463e9;--navy:#102a43;--line:#d8e5fa;--soft:#f6f9ff;--muted:#73819a;--green:#12a36d;--red:#e7565b;--orange:#f48a4b}
    *{box-sizing:border-box} body{margin:0;background:#edf3fc;color:var(--navy);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;word-break:keep-all}button,input{font:inherit}button{cursor:pointer}
    #app{min-height:100vh;display:grid;place-items:center;padding:20px}.phone{position:relative;width:min(100%,420px);height:min(900px,calc(100vh - 40px));min-height:720px;overflow:hidden;background:var(--soft);border:9px solid #101010;border-radius:42px;box-shadow:0 24px 70px #163b722b}.screen{height:100%;display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;padding:14px 22px 5px;background:#fff;font-size:12px;font-weight:800;color:#111}.content{flex:1;overflow:auto;padding:18px 18px 106px}.content::-webkit-scrollbar{display:none}
    .brand{color:var(--blue);font-size:20px;font-weight:900;letter-spacing:-.05em}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.title{margin:7px 0 0;font-size:28px;letter-spacing:-.07em}.round-icon,.back{border:0;background:transparent;color:var(--blue);font-size:27px;padding:4px}.card{margin:12px 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff}.card-title{margin:0 0 10px;font-size:16px;font-weight:900}.muted{color:var(--muted);font-size:13px}.big{font-size:32px;font-weight:900;letter-spacing:-.06em;color:var(--blue)}.green{color:var(--green)}.danger{color:var(--red)}
    .nav{position:absolute;z-index:3;bottom:0;left:0;right:0;height:78px;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:7px}.nav button{flex:1;border:0;background:transparent;color:#7a879c;font-size:11px}.nav .icon{display:block;font-size:21px;margin-bottom:3px}.nav button.active{color:var(--blue);font-weight:900}
    .primary,.secondary{width:100%;min-height:46px;border-radius:11px;font-weight:900}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff}.secondary{border:1px solid #b9d2ff;background:#fff;color:var(--navy)}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 13px;background:#fff;color:var(--navy)}.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.login{justify-content:center;padding:28px}.login h1{font-size:29px;line-height:1.35;letter-spacing:-.07em;margin:24px 0 35px}.login .guest{margin-top:14px;color:var(--blue);background:#f5f9ff}.login-note{text-align:center;color:var(--muted);font-size:12px;margin:9px 0 18px}.link{color:var(--blue);font-weight:900}.splash{display:grid;place-items:center;align-content:center;gap:22px;background:#f7faff}.splash-logo{display:flex;align-items:center;gap:13px;color:var(--blue);font-size:56px;font-weight:900}.splash-pill{height:210px;width:102px;display:grid;place-items:center;border:1px solid #c7dbfc;border-radius:28px;background:#fff;font-size:27px;box-shadow:0 12px 30px #1463e921}.splash p{font-weight:800}.dots{display:flex;gap:8px;margin-top:50px}.dots i{width:8px;height:8px;border-radius:50%;background:#bdd2fa}.dots i:first-child{background:var(--blue)}
    .segment{display:flex;border:1px solid #bfd3f5;border-radius:12px;overflow:hidden;background:#fff;margin:10px 0 14px}.segment button{flex:1;padding:12px;border:0;background:transparent;color:var(--muted);font-weight:900}.segment button.active{background:var(--blue);color:#fff}.date-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-weight:800}.date-row button{border:0;background:transparent;color:var(--blue);font-size:22px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0;border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 5px;text-align:center}.summary div+div{border-left:1px solid var(--line)}.summary span{display:block;color:var(--muted);font-size:11px}.summary b{display:block;color:var(--blue);font-size:16px;margin-top:5px}.summary .out{color:var(--red)}
    .day-card{padding:0}.day-head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #edf2fb;font-weight:900}.day-head button{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:900}.entry{display:flex;gap:11px;align-items:center;padding:11px 14px;border-bottom:1px solid #edf2fb}.entry:last-child{border-bottom:0}.entry-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#edf5ff;color:var(--blue)}.entry-copy{flex:1}.entry-copy b{font-size:14px}.entry-copy small{display:block;color:var(--muted);margin-top:3px}.entry-amount{font-weight:900}.income{color:var(--green)}.expense{color:var(--red)}.add-fab{position:absolute;right:21px;bottom:91px;z-index:4;border:0;border-radius:25px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:900;box-shadow:0 9px 20px #1463e946}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:10px}.weekday{font-size:11px;color:var(--muted);text-align:center;padding:7px 0}.calendar button{min-height:66px;padding:5px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;text-align:left;vertical-align:top;color:var(--navy)}.calendar button.today{background:#eef5ff;outline:2px solid var(--blue);outline-offset:-2px}.calendar small{display:block;font-size:9px;line-height:1.45}.plus-val{color:var(--green)}.minus-val{color:var(--red)}
    .sheet-title{margin:7px 0 16px;font-size:22px;letter-spacing:-.06em}.type-toggle{display:flex;gap:8px;margin-bottom:14px}.type-toggle button{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-weight:900}.type-toggle button.active{border-color:var(--blue);background:#eef5ff;color:var(--blue)}.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.category-grid button{min-height:64px;padding:7px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);font-size:12px;font-weight:800}.category-grid button.active{border:2px solid var(--blue);color:var(--blue);background:#f4f8ff}.custom-add{display:flex;gap:8px}.custom-add input{flex:1;border:1px solid var(--line);border-radius:9px;padding:0 10px}.custom-add button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:0 14px;font-weight:900}
    .donut-wrap{display:grid;place-items:center;padding:10px 0 4px}.donut{width:205px;height:205px;border-radius:50%;position:relative}.donut:after{content:"";position:absolute;inset:55px;border-radius:50%;background:#fff}.donut-center{position:absolute;z-index:1;text-align:center;font-size:12px;font-weight:900;color:var(--muted)}.donut-center b{display:block;color:var(--navy);font-size:19px;margin-top:4px}.rank-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #edf2fb}.rank-row:last-child{border-bottom:0}.dot-color{width:10px;height:10px;border-radius:50%}.rank-num{width:15px;color:var(--blue);font-weight:900}.rank-name{flex:1;font-size:13px;font-weight:800}.rank-value{font-size:12px;color:var(--muted);text-align:right}.rank-value b{display:block;color:var(--navy)}
    .asset-card{background:linear-gradient(135deg,#fff,#f0f6ff)}.chart{height:70px;margin-top:8px;display:flex;align-items:end;gap:6px}.chart i{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(#69a2ff,var(--blue))}.goal-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:10px;background:#e5edf9;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:99px}.mission{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #dce8fa}.mission:last-child{border:0}.check{width:25px;height:25px;border-radius:50%;border:1px solid #aebfd9;display:grid;place-items:center;color:#fff}.check.done{background:var(--blue);border-color:var(--blue)}.mission span{flex:1;font-size:14px;font-weight:800}.callout{padding:13px;border-radius:12px;background:#eef6ff;color:var(--blue);font-size:13px;font-weight:800}
    .ring-row{display:flex;align-items:center;gap:16px}.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--blue) 0 62%,#e4ebf5 62% 100%);display:grid;place-items:center;flex:0 0 auto}.ring:after{content:"";position:absolute;width:96px;height:96px;border-radius:50%;background:#fff}.ring b{position:relative;z-index:1;color:var(--green);font-size:28px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric-card{padding:13px;border-radius:13px;background:#f8fbff;border:1px solid var(--line)}.metric-card span{display:block;color:var(--muted);font-size:12px}.metric-card b{display:block;margin-top:8px;color:var(--blue);font-size:20px}.profile{display:flex;align-items:center;gap:12px}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:25px}.profile b{font-size:19px}.settings button{display:flex;width:100%;gap:10px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid #edf2fb;background:transparent;color:var(--navy);text-align:left}.settings button:last-child{border-bottom:0}.settings .set-icon{color:var(--blue);font-size:19px;width:25px}.settings .set-copy{flex:1;font-weight:900}.settings small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.chev{color:var(--muted)}.logout{width:100%;padding:13px;border:1px solid #f0c4c6;border-radius:12px;background:#fff;color:var(--red);font-weight:900}
    .toast{position:absolute;z-index:10;left:20px;right:20px;bottom:90px;padding:13px;border-radius:11px;background:var(--navy);color:#fff;text-align:center;font-size:13px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-height:760px){#app{padding:0}.phone{height:100vh;border-radius:0;border-width:0;min-height:0;width:100%}.content{padding-bottom:90px}.status{padding-top:10px}}
  </style>
</head>
<body><div id="app"></div>
<script>
const expenseCategories=['식비','교통/차량','쇼핑/생활','건강/의료','문화/취미','자기계발/학업','경조사/회비','저축/자산','기타'];
const incomeCategories=['월급','용돈','부수입','상여','금융소득','기타'];
const colorSets=['#ff6266','#ff9447','#ffd132','#b9dc39','#64c878','#2db9bc','#438cf3','#285bd3','#8a4be7'];
const state={page:'splash',tab:'home',ledgerView:'daily',statType:'expense',entryType:'expense',entryDate:'2026-08-25',entryCategory:'식비',customCategories:[],profile:{balance:128000,goal:{title:'교환학생',target:10000000,saved:6200000,date:'2026.08.31'},expenses:[['점심 식비',8500,'식비','2026-08-25'],['버스',1450,'교통/차량','2026-08-25'],['카페',4500,'식비','2026-08-24'],['책 구매',15000,'자기계발/학업','2026-08-23'],['전시회',12000,'문화/취미','2026-08-22'],['택시',24000,'교통/차량','2026-08-21'],['생일 선물',10000,'경조사/회비','2026-08-20'],['영양제',7410,'건강/의료','2026-08-19'],['문구류',5250,'쇼핑/생활','2026-08-18'],['적금',3000,'저축/자산','2026-08-17'],['기타 지출',1000,'기타','2026-08-16']],income:[['8월 용돈',300000,'용돈','2026-08-25'],['과외비',150000,'부수입','2026-08-23'],['주말 알바비',80000,'월급','2026-08-21'],['보너스',40000,'상여','2026-08-19'],['이자 수익',20000,'금융소득','2026-08-17'],['기타 수입',10000,'기타','2026-08-15']]}};
const won=n=>Number(n).toLocaleString('ko-KR')+'원'; const total=list=>list.reduce((s,x)=>s+x[1],0); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function phone(body,nav=true){return `<main class="phone"><div class="status"><span>9:41</span><span>▮◔ ▰</span></div><section class="screen">${body}</section>${nav?navigation():''}<div id="toast" class="toast"></div></main>`}
function navigation(){const items=[['ledger','▤','가계부'],['stats','▥','통계'],['home','⌂','홈'],['whatif','✦','만약에'],['my','●','마이']];return `<nav class="nav">${items.map(([key,icon,label])=>`<button class="${state.tab===key?'active':''}" onclick="go('${key}')"><span class="icon">${icon}</span>${label}</button>`).join('')}</nav>`}
function header(title,action=''){return `<div class="top"><div><div class="brand">돈__조</div><h1 class="title">${title}</h1></div>${action?`<button class="round-icon" onclick="${action}">⚙</button>`:''}</div>`}
function render(){let html='';if(state.page==='splash')html=phone(`<div class="splash"><div class="splash-logo"><span>돈</span><div class="splash-pill">지켜</div><span>조</span></div><p>나의 돈을 지켜조</p><div class="dots"><i></i><i></i><i></i></div></div>`,false);else if(state.page==='login')html=login();else if(state.page==='entry')html=entry();else html=appPage();document.getElementById('app').innerHTML=html;if(state.page==='splash')setTimeout(()=>{state.page='login';render()},1600)}
function login(){return phone(`<div class="content login"><button class="back" onclick="toast('시작 화면입니다.')">‹</button><h1>돈의 미래,<br>함께 볼까요?</h1><div class="field"><label>이메일</label><input id="email" type="email" placeholder="이메일"></div><div class="field"><label>비밀번호</label><input id="password" type="password" placeholder="비밀번호"></div><button class="primary" onclick="loginWithEmail()">로그인</button><div class="divider">또는</div><button class="secondary" onclick="toast('Google 로그인은 준비 중이에요.')">ⓖ Google로 계속하기</button><button class="secondary" style="margin-top:10px" onclick="toast('Apple 로그인은 준비 중이에요.')">● Apple로 계속하기</button><p class="login-note">계정이 없나요? <span class="link">회원가입</span></p><button class="secondary guest" onclick="startDemo()">게스트로 시작하기<br><small>회원가입 없이 샘플 데이터로 둘러보기</small></button></div>`,false)}
function appPage(){if(state.tab==='ledger')return ledger();if(state.tab==='stats')return stats();if(state.tab==='whatif')return whatif();if(state.tab==='my')return my();return home()}
function home(){const g=state.profile.goal,p=Math.round(g.saved/g.target*100);return phone(`<div class="content">${header('홈','toast(\'알림 설정을 준비 중이에요.\')')}<div class="card asset-card"><p class="card-title">현재 자산</p><div class="big">${won(state.profile.balance)}</div><p class="green"><b>이번 달 +42,000원</b></p><div class="chart"><i style="height:25%"></i><i style="height:40%"></i><i style="height:34%"></i><i style="height:62%"></i><i style="height:57%"></i><i style="height:78%"></i><i style="height:100%"></i></div></div><div class="card"><div class="goal-row"><div><p class="card-title">전체 목표</p><b>${g.title}</b></div><b class="green" style="font-size:27px">${p}%</b></div><div class="progress"><i style="width:${p}%"></i></div><div class="goal-row"><span class="muted">${won(g.saved)} / ${won(g.target)}</span><b class="muted">목표까지 128일</b></div></div><div class="card"><p class="card-title">오늘의 미션</p><p class="muted">목표를 더 빨리 이루는 작은 습관</p>${mission('☕','커피 마시기 주 4회 이하',true)}${mission('💳','오늘 지출 15,000원 안에서',true)}${mission('▤','가계부 내역 기록하기',false)}<p style="text-align:center;color:var(--blue);font-weight:900">2 / 3 완료</p><div class="callout">🌱 오늘 미션을 모두 완료하면 목표가 1일 빨라져요!</div></div></div>`)}
function mission(icon,label,done){return `<div class="mission"><span style="font-size:19px;flex:0">${icon}</span><span>${label}</span><i class="check ${done?'done':''}">${done?'✓':''}</i></div>`}
function ledger(){const monthLabel='2026년 8월';return phone(`<div class="content">${header('가계부')}<div class="segment"><button class="${state.ledgerView==='daily'?'active':''}" onclick="setLedger('daily')">일일</button><button class="${state.ledgerView==='monthly'?'active':''}" onclick="setLedger('monthly')">월별</button></div><div class="date-row"><button>‹</button><span>${monthLabel}</span><button>›</button></div>${state.ledgerView==='daily'?dailyLedger():monthlyLedger()}</div><button class="add-fab" onclick="openEntry('expense')">＋ 내역 추가</button>`)}
function dailyLedger(){const all=[...state.profile.income.map(x=>({...row(x),type:'income'})),...state.profile.expenses.map(x=>({...row(x),type:'expense'}))];const dates=[...new Set(all.map(x=>x.date))].sort().reverse().slice(0,5);const todayIncome=total(state.profile.income.filter(x=>x[3]==='2026-08-25'));const todayOut=total(state.profile.expenses.filter(x=>x[3]==='2026-08-25'));return `<div class="summary"><div><span>오늘 수입</span><b>${won(todayIncome)}</b></div><div><span>오늘 지출</span><b class="out">${won(todayOut)}</b></div><div><span>남은 금액</span><b>${won(todayIncome-todayOut)}</b></div></div>${dates.map(d=>{const rows=all.filter(x=>x.date===d);return `<div class="card day-card"><div class="day-head"><span>${d.slice(8)}일 · ${d==='2026-08-25'?'화요일':''}</span><button onclick="openEntry('expense','${d}')">내역 추가</button></div>${rows.map(x=>entryRow(x)).join('')}</div>`}).join('')}`}
function row(x){return {title:x[0],amount:x[1],category:x[2],date:x[3]}}
function entryRow(x){const income=x.type==='income';return `<div class="entry"><div class="entry-icon">${income?'₩':'●'}</div><div class="entry-copy"><b>${esc(x.title)}</b><small>${esc(x.category)} · ${x.date}</small></div><strong class="entry-amount ${income?'income':'expense'}">${income?'+':'−'}${won(x.amount)}</strong></div>`}
function monthlyLedger(){const map={};[...state.profile.income.map(x=>({...row(x),type:'income'})),...state.profile.expenses.map(x=>({...row(x),type:'expense'}))].forEach(x=>{(map[x.date]??=[]).push(x)});const cells=Array.from({length:35},(_,i)=>i-4);return `<div class="summary"><div><span>이번 달 수입</span><b>${won(total(state.profile.income))}</b></div><div><span>이번 달 지출</span><b class="out">${won(total(state.profile.expenses))}</b></div><div><span>남은 금액</span><b>${won(total(state.profile.income)-total(state.profile.expenses))}</b></div></div><div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.map(day=>{if(day<1||day>31)return '<div class="calendarCell"></div>';const d=`2026-08-${String(day).padStart(2,'0')}`,rows=map[d]||[],inc=total(rows.filter(x=>x.type==='income')),out=total(rows.filter(x=>x.type==='expense'));return `<button class="${day===25?'today':''}" onclick="openEntry('expense','${d}')"><b>${day}</b>${inc?`<small class="plus-val">+${Math.round(inc/1000)}천</small>`:''}${out?`<small class="minus-val">−${Math.round(out/1000)}천</small>`:''}</button>`}).join('')}</div>`}
function openEntry(type,date){state.page='entry';state.entryType=type;state.entryDate=date||'2026-08-25';state.entryCategory=type==='income'?'용돈':'식비';render()}
function entry(){const isIncome=state.entryType==='income',cats=[...(isIncome?incomeCategories:expenseCategories),...state.customCategories];return phone(`<div class="content">${header(isIncome?'수입 추가':'지출 추가')}<button class="back" onclick="closeEntry()">‹</button><div class="type-toggle"><button class="${isIncome?'active':''}" onclick="openEntry('income',state.entryDate)">수입</button><button class="${!isIncome?'active':''}" onclick="openEntry('expense',state.entryDate)">지출</button></div><div class="field"><label>날짜</label><input value="${state.entryDate}" readonly></div><div class="field"><label>금액</label><input id="entryAmount" inputmode="numeric" placeholder="금액"></div><div class="field"><label>내용</label><input id="entryTitle" placeholder="예: 점심 식비"></div><p class="card-title">${isIncome?'수입':'지출'} 카테고리</p><div class="category-grid">${cats.map(c=>`<button class="${state.entryCategory===c?'active':''}" onclick="pickCategory('${c}')">${c==='기타'?'＋ ':''}${c}</button>`).join('')}</div>${state.entryCategory==='기타'?`<div class="custom-add"><input id="customCategory" placeholder="직접 카테고리 입력"><button onclick="addCustomCategory()">추가</button></div>`:''}<button class="primary" style="margin-top:16px" onclick="saveEntry()">저장하기</button></div>`)}
function stats(){const isIncome=state.statType==='income',categories=isIncome?incomeCategories:expenseCategories,list=isIncome?state.profile.income:state.profile.expenses,items=categories.map((name,i)=>({name,total:total(list.filter(x=>x[2]===name)),color:colorSets[i]})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);const sum=total(items.map(x=>['',x.total]));let at=0;const slices=items.map(x=>{const start=at/sum*360;at+=x.total;return `${x.color} ${start}deg ${at/sum*360}deg`}).join(',');return phone(`<div class="content">${header('통계')}<div class="date-row"><button>‹</button><span>2026년 8월</span><button>›</button></div><div class="segment"><button class="${isIncome?'active':''}" onclick="setStats('income')">수입</button><button class="${!isIncome?'active':''}" onclick="setStats('expense')">지출</button></div><h2 class="sheet-title">8월 ${isIncome?'수입':'지출'} 분석</h2><div class="card"><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${slices||'#e5edf9 0 360deg'})"><div class="donut-center">이번 달<b>${won(sum)}</b></div></div></div>${items.map((x,i)=>`<div class="rank-row"><span class="rank-num">${i+1}</span><i class="dot-color" style="background:${x.color}"></i><span class="rank-name">${x.name}</span><span class="rank-value">${Math.round(x.total/sum*100)}%<b>${won(x.total)}</b></span></div>`).join('')}</div><div class="callout">✦ 가장 ${isIncome?'큰 수입':'많이 쓴 항목'}은 ${items[0]?.name||'없어요'}예요.</div></div>`)}
function whatif(){const g=state.profile.goal,p=Math.round(g.saved/g.target*100),remain=g.target-g.saved;return phone(`<div class="content">${header('만약에','toast(\'목표 설정을 준비 중이에요.\')')}<div class="card"><p class="card-title">전체 목표</p><b style="font-size:24px">${g.title}</b><div class="ring-row"><div class="ring"><b>${p}%</b></div><div><b class="green" style="font-size:24px">${100-p}% 남았어요</b><p><b>${won(remain)}</b> 더 필요해요</p><div class="progress"><i style="width:${p}%"></i></div><span class="muted">목표일 ${g.date} · 128일 남음</span></div></div></div><div class="card"><p class="card-title">목표를 이루려면</p><div class="metric-grid"><div class="metric-card"><span>하루 저축 목표</span><b>29,700원</b></div><div class="metric-card"><span>이번 주 목표</span><b>207,900원</b></div></div></div><div class="card"><p class="card-title">오늘의 일일 목표</p>${mission('✓','커피 마시기 주 4회 이하',true)}${mission('✓','오늘 지출 15,000원 안에서',true)}${mission('○','가계부 내역 기록하기',false)}<div class="callout" style="margin-top:12px">🎯 오늘 목표를 달성하면 교환학생에 한 걸음 더 가까워져요!</div></div></div>`)}
function my(){return phone(`<div class="content">${header('마이','toast(\'프로필 편집을 준비 중이에요.\')')}<div class="card"><div class="profile"><div class="avatar">●</div><div><b>사용자</b><p class="muted" style="margin:5px 0 0">guest@donjo.app</p></div><button class="secondary" style="width:auto;margin-left:auto;padding:9px 10px" onclick="toast('프로필 편집을 준비 중이에요.')">프로필 편집</button></div></div><h2 class="sheet-title">개인 설정</h2><div class="card settings">${setting('♢','내 위험 기준','경고 200,000원 · 위험 100,000원')}${setting('◎','목표 관리','교환학생 · 62% 진행')}${setting('♧','알림 설정','오늘의 미션 알림 켜짐')}${setting('▣','카테고리 관리',`직접 만든 카테고리 ${state.customCategories.length}개`)}${setting('◫','데이터 관리','내역 내보내기 및 백업')}${setting('⚙','앱 설정','다크 모드 · 글자 크기')}</div><button class="logout" onclick="state.page='login';render()">로그아웃</button></div>`)}
function setting(icon,title,desc){return `<button onclick="toast('${title} 설정을 준비 중이에요.')"><span class="set-icon">${icon}</span><span class="set-copy">${title}<small>${desc}</small></span><span class="chev">›</span></button>`}
function go(tab){state.tab=tab;state.page='app';render()}function setLedger(v){state.ledgerView=v;render()}function setStats(v){state.statType=v;render()}function startDemo(){state.page='app';state.tab='home';render()}function loginWithEmail(){toast('로그인은 준비 중이에요. 게스트로 시작해 보세요.')}function closeEntry(){state.page='app';state.tab='ledger';render()}function pickCategory(c){state.entryCategory=c;render()}function addCustomCategory(){const input=document.getElementById('customCategory'),name=input?.value.trim();if(!name)return toast('카테고리 이름을 입력해 주세요.');state.customCategories.push(name);state.entryCategory=name;render()}function saveEntry(){const title=document.getElementById('entryTitle').value.trim(),amount=Number(document.getElementById('entryAmount').value.replace(/[^0-9]/g,''));if(!title||!amount)return toast('내용과 금액을 입력해 주세요.');const item=[title,amount,state.entryCategory,state.entryDate];(state.entryType==='income'?state.profile.income:state.profile.expenses).unshift(item);closeEntry();toast('내역을 저장했어요.')}function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
render();
</script></body></html>
